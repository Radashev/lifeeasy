services:
  api:
    build:
      context: .
      target: production

    container_name: lifeeasy-api-prod

    restart: unless-stopped

    ports:
      - "8006:8000"

    env_file:
      - .env.prod


    depends_on:
      postgres:
        condition: service_started
      mongo:
        condition: service_started
      redis:
        condition: service_started

  postgres:
    image: postgres:17

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

  mongo:
    image: mongo:8

    restart: unless-stopped

    volumes:
      - mongo_prod_data:/data/db

    redis:
      image: redis:7-alpine

      restart: unless-stopped

      volumes:
        - redis_prod_data:/data

  volumes:
    postgres_prod_data:
    mongo_prod_data:
    redis_prod_data:
